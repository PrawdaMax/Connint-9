name: CI Pipeline (Verify, Build, and Push)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. VERIFY & COMPILE STAGE
  # ----------------------------------------------------
  verify-and-compile:
    name: Typecheck & Compile TypeScript
    runs-on: ubuntu-latest

    # Keeps the postgres service sidecar in case future steps need it,
    # though it's primarily used here to validate prisma schemas/migrations.
    services:
      database:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypass
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generates the Prisma client using your package.json config
      - name: Generate Prisma Client
        run: npx prisma generate

      # Runs your actual compilation script to verify the TS code compiles perfectly
      - name: Typecheck Application (Build)
        env:
          DATABASE_URL: "postgresql://myuser:mypass@localhost:5432/mydatabase?schema=public"
        run: npm run build

  # ----------------------------------------------------
  # 2. DOCKER BUILD & PUSH STAGE
  # ----------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: verify-and-compile # Ensures this only runs if compilation succeeds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}